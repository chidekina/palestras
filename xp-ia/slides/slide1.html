<!DOCTYPE html>
<html>
<head>
<style>
html { background: #222831; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #222831; font-family: Arial, sans-serif;
  display: flex; align-items: center; justify-content: center;
}
.accent-bar {
  position: absolute; left: 0; top: 0; width: 12pt; height: 405pt;
  background: #F96D00;
}
.content {
  display: flex; flex-direction: column; justify-content: center;
  padding: 0 60pt 0 80pt; width: 100%;
}
.tag {
  display: inline-block; background: #F96D00; border-radius: 4pt;
  padding: 4pt 12pt; margin-bottom: 24pt;
}
.tag p { color: #FFFFFF; font-size: 11pt; font-weight: bold; letter-spacing: 2pt; margin: 0; }
h1 { color: #EEEEEE; font-size: 42pt; line-height: 1.1; margin: 0 0 20pt 0; }
.subtitle { color: #AAAAAA; font-size: 14pt; line-height: 1.5; max-width: 560pt; }
.speaker {
  margin-top: 36pt; border-top: 1pt solid #393E46;
  padding-top: 16pt; display: flex; align-items: center;
}
.speaker p { color: #888888; font-size: 12pt; margin: 0; }
.speaker .name { color: #F96D00; font-weight: bold; }
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="content">
  <div class="tag"><p>AGILE &amp; AI · 2026</p></div>
  <h1>O Método XP<br>Aplicado com IA</h1>
  <div class="subtitle">
    <p>Como o XP potencializa o uso de IA no desenvolvimento de software — TDD, Pair Programming e Refatoração sob a lente das ferramentas inteligentes.</p>
  </div>
  <div class="speaker">
    <p><span class="name">César Nagano</span> &nbsp;·&nbsp; Engenheiro de Software &amp; Fundador da Aethos Tech</p>
  </div>
</div>
</body>
</html>
